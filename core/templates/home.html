{% extends 'base.html' %}
{% load static %}

{% block content %}

<div style="
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
    padding: 40px;
    flex-wrap: wrap;
    text-align: center;
">

    <!-- IMAGE -->
    <div>
        <img src="{% static 'images/profile.jpeg' %}" 
             alt="Profile Image"
             style="
                width: 220px;
                height: 220px;
                border-radius: 50%;
                object-fit: cover;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
             ">
    </div>

    <!-- TEXT -->
    <div style="max-width: 500px;">
        <h1 style="color:#6a4c93; margin-bottom: 10px;">
            Hello, I'm Maryanne 👋
        </h1>

        <h2 style="font-weight: 400; color:#444;">
            Aspiring Software Developer
        </h2>

        <p style="line-height: 1.6; color:#555;">
            I build clean, user-friendly applications using Django and Python.  
            I am passionate about learning, problem-solving, and growing in tech.
        </p>

        <a href="https://github.com/still-purrfect" target="_blank"
           style="
                display:inline-block;
                margin-top:15px;
                padding:10px 18px;
                background:#6C63FF;
                color:white;
                text-decoration:none;
                border-radius:8px;
           ">
           View My GitHub
        </a>
    </div>

</div>

{% endblock %}
